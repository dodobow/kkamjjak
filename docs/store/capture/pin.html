<!doctype html>
<html lang="ko">
  <head>

    <title>깜짝! 확장 프로그램 고정 안내</title>
    <link rel="stylesheet" href="../../../styles/tokens.css">

  <body class="capture-pin">

        <img src="../../../assets/icons/icon128.png" width="128" height="128" alt="">

      <figure class="whale-pin-demo">
