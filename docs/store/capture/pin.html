<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>깜짝! 확장 프로그램 고정 안내</title>
    <link rel="stylesheet" href="../../../styles/tokens.css">
    <link rel="stylesheet" href="capture.css">
  </head>
  <body class="capture-pin">
    <main class="pin-guide">
      <section class="pin-guide-copy">
        <img src="../../../assets/icons/icon128.png" width="128" height="128" alt="">
        <p class="pin-guide-eyebrow">한 번만 해두면 편해요</p>
        <h1>깜짝!을<br>브라우저에 고정하세요</h1>
        <p class="pin-guide-description">확장 프로그램 메뉴에서 깜짝! 옆의 고정 버튼을 누르면 툴바에서 바로 열 수 있습니다.</p>
        <ol class="pin-guide-steps">
          <li><span>1</span>확장 프로그램 메뉴 열기</li>
          <li><span>2</span>깜짝! 옆 고정 버튼 누르기</li>
          <li><span>3</span>툴바의 깜짝! 아이콘 열기</li>
        </ol>
      </section>

      <section class="browser-pin-demo" aria-label="확장 프로그램 고정 방법 예시">
        <div class="browser-toolbar">
          <div class="browser-controls" aria-hidden="true"><span></span><span></span><span></span></div>
          <div class="browser-address">인터넷을 둘러보는 중</div>
          <div class="browser-actions">
            <div class="toolbar-app is-pinned">
              <img src="../../../assets/icons/icon48.png" width="32" height="32" alt="">
            </div>
            <div class="extension-trigger" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="M19.4 7.6a1 1 0 0 0-1 .2 2 2 0 1 1-2.8-2.8 1 1 0 0 0 .2-1L14.6 2.8a2 2 0 0 0-2.8 0L9 5.6a1 1 0 0 1-1 .2A2 2 0 1 0 5.2 8.6a1 1 0 0 1-.2 1l-2.2 2.2a2 2 0 0 0 0 2.8l1.2 1.2a1 1 0 0 0 1-.2 2 2 0 1 1 2.8 2.8 1 1 0 0 0-.2 1l1.2 1.2a2 2 0 0 0 2.8 0l2.2-2.2a1 1 0 0 1 1-.2 2 2 0 1 0 2.8-2.8 1 1 0 0 1 .2-1l2.8-2.8a2 2 0 0 0 0-2.8z"/></svg>
            </div>
          </div>
        </div>

        <div class="extension-menu">
          <div class="extension-menu-head">
            <div>
              <strong>확장 프로그램</strong>
              <span>브라우저에 설치된 항목</span>
            </div>
          </div>
          <div class="extension-row">
            <img src="../../../assets/icons/icon48.png" width="48" height="48" alt="">
            <div class="extension-row-copy">
              <strong>깜짝!</strong>
              <span>한 시간마다 한 번</span>
            </div>
            <div class="pin-action">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 17v5M5 17h14M6 17l1-6-2-2V7h14v2l-2 2 1 6H6z"/></svg>
              <span>고정</span>
            </div>
          </div>
          <p class="extension-menu-note">고정하면 브라우저 상단에 깜짝! 아이콘이 나타납니다.</p>
        </div>
      </section>
    </main>
  </body>
</html>
