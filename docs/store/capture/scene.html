<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>깜짝! 랜선 여행 스토어 캡처</title>
    <link rel="stylesheet" href="/styles/tokens.css">
    <link rel="stylesheet" href="/pages/event/event.css">
    <script src="mock-extension.js"></script>
  </head>
  <body>
    <div id="sceneBackdrop" class="scene-backdrop" aria-hidden="true" hidden></div>
    <div id="sceneEffects" class="scene-effects" aria-hidden="true" hidden></div>
    <main class="event-page">
      <div class="event-toolbar">
        <label class="theme-toggle">
          <span>다크 모드</span>
          <input id="themeToggle" type="checkbox" role="switch" data-theme-toggle>
          <span class="theme-toggle-control" aria-hidden="true"></span>
        </label>
      </div>
      <p class="eyebrow" id="categoryText">새 탭</p>
      <h1 id="eventTitle">깜짝!</h1>
      <p id="eventMessage" class="message">이 페이지는 확장 프로그램 안에서 열렸습니다.</p>
      <div id="oracleBox" class="oracle-box"></div>
      <button id="closeButton" type="button">원래 탭으로 돌아가기</button>
    </main>

    <script type="module" src="/pages/event/event.js"></script>
  </body>
</html>
