<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>도파민 버튼</title>
    <script src="src/theme-init.js"></script>
    <link rel="stylesheet" href="styles/tokens.css">
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="popup-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">오늘의 작은 랜덤</p>
          <h1 id="appName">도파민 버튼</h1>
        </div>
        <label class="theme-toggle">
          <span>다크 모드</span>
          <input id="themeToggle" type="checkbox" role="switch" data-theme-toggle>
          <span class="theme-toggle-control" aria-hidden="true"></span>
        </label>
      </header>

      <p id="appDescription" class="description">누르면 무슨 일이 일어날지 모릅니다.</p>

      <section class="button-zone" aria-label="메인 버튼">
        <button id="mainButton" class="primary-button" type="button">
          오늘의 한 장 열기
        </button>
        <p id="cooldownText" class="cooldown-text">버튼 사용 가능</p>
        <p id="statusText" class="status-text" role="status" aria-live="polite"></p>
      </section>

      <section class="progress-panel" aria-label="수집 진행률">
        <div class="progress-head">
          <span>수집 진행률</span>
          <strong id="progressText">0 / 20 발견</strong>
        </div>
        <div
          class="progress-track"
          role="progressbar"
          aria-label="수집 진행률"
          aria-valuemin="0"
          aria-valuemax="20"
          aria-valuenow="0"
        >
          <span id="progressFill"></span>
        </div>
        <div id="categoryProgress" class="category-progress"></div>
      </section>

      <section class="last-result" aria-label="최근 결과">
        <p class="section-label">최근 결과</p>
        <div id="lastResultText" class="last-result-box">
          아직 열어 본 장면이 없어요.
        </div>
      </section>

      <button id="openCollectionButton" class="secondary-button" type="button">
        도감 열기
      </button>
    </main>

    <script type="module" src="popup.js"></script>
  </body>
</html>
