<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>도감</title>
    <script src="src/theme-init.js"></script>
    <link rel="stylesheet" href="styles/tokens.css">
    <link rel="stylesheet" href="collection.css">
  </head>
  <body>
    <header class="collection-header">
      <div>
        <p class="eyebrow">발견한 장면</p>
        <h1 id="collectionTitle">도감</h1>
        <p id="collectionDescription">버튼에서 나온 작은 우연을 모아둡니다.</p>
      </div>
      <div class="header-tools">
        <label class="theme-toggle">
          <span>다크 모드</span>
          <input id="themeToggle" type="checkbox" role="switch" data-theme-toggle>
          <span class="theme-toggle-control" aria-hidden="true"></span>
        </label>
        <div class="summary">
          <strong id="totalProgress">0 / 20</strong>
          <span>발견</span>
        </div>
      </div>
    </header>

    <main class="collection-layout">
      <aside class="stats-panel">
        <h2>카테고리</h2>
        <div id="categoryStats"></div>
        <p id="statusText" class="status-text" role="status" aria-live="polite"></p>
      </aside>

      <section id="eventSections" class="event-sections" aria-label="이벤트 도감"></section>
    </main>

    <script type="module" src="collection.js"></script>
  </body>
</html>
