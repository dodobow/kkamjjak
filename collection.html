<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>깜짝! 도감</title>
    <script src="src/theme-init.js"></script>
    <link rel="stylesheet" href="styles/tokens.css">
    <link rel="stylesheet" href="collection.css">
  </head>
  <body>
    <header class="collection-header">
      <div>
        <p class="eyebrow">지금까지 나온 것들</p>
        <div class="brand-heading">
          <span class="brand-mark" aria-hidden="true">!</span>
          <h1 id="collectionTitle">깜짝! 도감</h1>
        </div>
        <p id="collectionDescription">열어서 나온 결과를 모았습니다.</p>
      </div>
      <div class="header-tools">
        <label class="theme-toggle">
          <span>다크 모드</span>
          <input id="themeToggle" type="checkbox" role="switch" data-theme-toggle>
          <span class="theme-toggle-control" aria-hidden="true"></span>
        </label>
        <div class="summary">
          <strong id="totalProgress">0 / 16</strong>
          <span>발견</span>
        </div>
      </div>
    </header>

    <main class="collection-layout">
      <aside class="stats-panel">
        <h2>카테고리</h2>
        <div id="categoryStats"></div>
        <p id="statusText" class="status-text" role="status" aria-live="polite"></p>
      </aside>

      <div class="collection-content">
        <div class="collection-toolbar">
          <label for="collectionSort">정렬</label>
          <select id="collectionSort" name="collectionSort">
            <option value="rarity">레어도순</option>
            <option value="discovered">발견한 것 먼저</option>
            <option value="undiscovered">미발견한 것 먼저</option>
          </select>
        </div>
        <section id="eventSections" class="event-sections" aria-label="깜짝! 도감"></section>
      </div>
    </main>

    <script type="module" src="collection.js"></script>
  </body>
</html>
